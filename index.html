<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <link rel="stylesheet" href="./views/style.css">
   
</head>
<body>
<div class="login-wrap">
    <div class="login-html">
        <form>
        <input id="tab-1" type="radio" name="tab" class="sign-in" checked>
        <label for="tab-1" class="tab">Sign In</label>
        <input id="tab-2" type="radio" name="tab" class="sign-up">
        <label for="tab-2" class="tab">Sign Up</label>
        
        <div class="login-form">
            <div class="sign-in-htm">
                <div class="group">
                    <label for="signin-email"  class="label">Email</label>
                    <input id="signin-email" type="email" class="input" placeholder="Email" required>
                    
                </div>
                <div class="group">
                    <label for="signin-pass" class="label">Password</label>
                    <input id="signin-pass" type="password" class="input" placeholder="Password" required>
                </div>
                
                
                <div class="group">
                    <input id="signin-check" type="checkbox" class="check" checked>
                    <label for="signin-check"><span class="icon"></span> Keep me signed in</label>
                </div>
                <div class="group">
                    <button id="signin-submit" class="button">Sign In</button>
                </div>
                <div class="hr"></div>
                <div class="foot-lnk">
                    <label for="tab-2">Don't have an account </label>
                </div>
            </div>
        </form>
    <form>    
           
            <div class="sign-up-htm">
                <div class="group">
                    <label for="signup-email" class="label">Email</label>
                    <input id="signup-email" type="text" class="input" placeholder="Email" required>
                </div>
                <div class="group">
                    <label for="signup-username" class="label">Username</label>
                    <input id="signup-username" type="text" class="input" placeholder="Username" required>
                </div>
                <div class="group">
                    <label for="signup-pass" class="label">Password</label>
                    <input id="signup-pass" type="password" class="input" placeholder="Password" required>
                </div>
                <div class="group">
                    <button id="signup-submit" class="button">Sign Up</button>
                </div>
                <div class="hr"></div>
                <div class="foot-lnk">
                    <label for="tab-1">Already a member?</label>
                </div>
            </div>
    </form>
        </div>
    </div>
</div>
<script src="./views/main.js"></script>
</body>
</html>
